services:
  analyzer:
    image: nishtyak-analyzer:0.2.0
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    network_mode: none
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.0
    pids_limit: 32
    init: true
    stdin_open: true
    tty: false
    restart: "no"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,uid=65532,gid=65532,mode=700
    logging:
      driver: none
    command:
      - --archive
      - "-"
      - --output
      - "-"
      - --memory-bytes
      - "536870912"
      - --cpu-seconds
      - "15"
      - --max-report-bytes
      - "8388608"
