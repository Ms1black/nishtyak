name: nishtyak-logic

x-settings: &settings
  NISHTYAK_DATA_DIR: /data
  NISHTYAK_RUNNER: docker
  NISHTYAK_ANALYZER_IMAGE: nishtyak-analyzer:0.1.0

services:
  initialize:
    image: python:3.11-slim
    user: "0:0"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER]
    security_opt: [no-new-privileges:true]
    volumes:
      - jobs:/data
    command:
      - python
      - -c
      - "import os; os.chmod('/data', 0o770); os.chown('/data', 65532, 65532)"
    restart: "no"

  logic:
    image: nishtyak-logic:0.1.0
    build:
      context: ..
      dockerfile: deploy/Dockerfile.service
      target: http
    environment:
      <<: *settings
      NISHTYAK_SERVICE_TOKEN: ${NISHTYAK_SERVICE_TOKEN:?Set a random service token}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-}
    ports:
      - "127.0.0.1:8010:8010"
    volumes:
      - jobs:/data
    depends_on:
      initialize:
        condition: service_completed_successfully
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m,uid=65532,gid=65532,mode=700
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 2
    pids_limit: 64
    init: true
    restart: unless-stopped
    stop_grace_period: 40s
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/healthz', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 3
    logging:
      driver: local
      options:
        max-size: 5m
        max-file: "2"

  dispatcher:
    image: nishtyak-dispatcher:0.1.0
    build:
      context: ..
      dockerfile: deploy/Dockerfile.service
      target: controller
    environment:
      <<: *settings
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      - jobs:/data
      - ${NISHTYAK_DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
    group_add:
      - "${NISHTYAK_DOCKER_GID:?Set the Docker socket group id}"
    depends_on:
      initialize:
        condition: service_completed_successfully
    network_mode: none
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=65532,gid=65532,mode=700
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 1
    pids_limit: 64
    init: true
    restart: unless-stopped
    stop_grace_period: 20s
    logging:
      driver: local
      options:
        max-size: 5m
        max-file: "2"

  analyzer-image:
    image: nishtyak-analyzer:0.1.0
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    profiles: [build]

volumes:
  jobs:
