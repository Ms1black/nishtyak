                file:
                  type: string
                  format: binary
                options:
                  type: string
                  maxLength: 65536
                  contentMediaType: application/json
                  contentSchema:
                    $ref: '#/components/schemas/AnalysisOptionsDTO'
                  description: AnalysisOptions JSON
                author_environment:
                  type: string
                  maxLength: 262144
                  contentMediaType: application/json
                  contentSchema:
                    $ref: '#/components/schemas/AuthorEnvironmentDTO'
                  description: Author's local Python/package metadata JSON; at most
                    256 KiB
              additionalProperties: false
              type: object
              required:
              - file
        required: true
