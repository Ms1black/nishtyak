          pattern: ^[A-Za-z0-9_.:-]{1,128}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdviceDTO'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdvisoryResult'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
          description: Bad Request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
          description: Unauthorized
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
          description: Not Found
        '408':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
          description: Request Timeout
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
          description: Conflict
        '413':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
          description: Request Entity Too Large
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
          description: Unprocessable Entity
        '429':
          headers:
            Retry-After:
              schema:
                type: string
              description: Retry delay in seconds
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
          description: Too Many Requests
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
          description: Internal Server Error
        '503':
          headers:
            Retry-After:
              schema:
                type: string
              description: Retry delay in seconds
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
          description: Service Unavailable
        '507':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
          description: Insufficient Storage
      security:
      - ServiceToken: []
