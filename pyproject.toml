[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nishtyak-core"
version = "0.2.0"
description = "Static reproducibility assistant for small Python projects"
requires-python = ">=3.11"
dependencies = ["packaging>=24"]

[project.optional-dependencies]
conda = ["PyYAML>=6"]
service = [
    "fastapi>=0.143,<1",
    "uvicorn>=0.54,<1",
    "python-multipart>=0.0.32,<1",
    "PyYAML>=6",
]
dev = [
    "pytest>=8",
    "ruff>=0.11",
    "PyYAML>=6",
    "httpx>=0.28,<1",
    "fastapi>=0.143,<1",
    "uvicorn>=0.54,<1",
    "python-multipart>=0.0.32,<1",
]

[project.scripts]
nishtyak = "nishtyak_core.cli:main"
nishtyak-service = "nishtyak_service.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
