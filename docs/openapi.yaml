openapi: 3.1.0
info:
  title: Nishtyak logic service
  version: 1.0.0
paths:
  /v1/projects:
    post:
      summary: Submit
      operationId: submit_v1_projects_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              properties:
                file:
                  type: string
                  format: binary
                options:
                  type: string
                  maxLength: 65536
                  contentMediaType: application/json
                  contentSchema:
                    $ref: '#/components/schemas/AnalysisOptionsDTO'
                  description: AnalysisOptions JSON
              additionalProperties: false
              type: object
              required:
              - file
        required: true
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmittedProjectDTO'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
        '408':
          description: Request Timeout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
        '413':
          description: Request Entity Too Large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
        '429':
          description: Too Many Requests
          headers:
            Retry-After:
              description: Retry delay in seconds
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
        '503':
          description: Service Unavailable
          headers:
            Retry-After:
              description: Retry delay in seconds
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
        '507':
          description: Insufficient Storage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
      security:
      - ServiceToken: []
      parameters:
      - name: X-Owner-ID
        in: header
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_.:-]{1,128}$
