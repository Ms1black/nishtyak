openapi: 3.1.0
info:
  title: nishtyak HTTP adapter contract
  version: 0.2.0
  description: Proposed asynchronous HTTP integration contract. Python core and worker are implemented; these HTTP
    routes are not implemented. All resources belong to the authenticated server-side session. Foreign resources
    return the same 404 as unknown resources. Server quotas override client options; overload returns 429 with Retry-After.
    See API_CONTRACT.md for lifecycle and limits.
security:
- SessionAuth: []
paths:
  /api/projects:
    post:
      operationId: createProject
      summary: Store a bounded ZIP and enqueue static analysis
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
                  description: ZIP up to 10 MiB. Uploaded files and build hooks are never executed.
                options:
                  type: string
                  maxLength: 65536
                  description: Optional JSON object matching AnalysisOptions; server limits take precedence.
      responses:
        '202':
          description: Project stored and analysis accepted; no analysis report is returned yet.
          headers:
            Location:
              description: Relative URL /api/jobs/{job_id} for polling.
              schema:
                type: string
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/UploadLimit'
        '415':
          $ref: '#/components/responses/UnsupportedMedia'
        '422':
          $ref: '#/components/responses/InvalidDto'
        '429':
          $ref: '#/components/responses/QuotaExceeded'
        default:
          $ref: '#/components/responses/AdapterError'
  /api/jobs/{job_id}:
    parameters:
    - name: job_id
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: getJob
      summary: Return the owned job lifecycle and its public report after success
      responses:
        '200':
          description: Lifecycle status is independent of analysis.status complete/partial. Only succeeded includes
            analysis, serialized through AnalysisReport.to_dict(). Failure states include a sanitized error. An
            expired owned job may remain as a metadata tombstone.
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/QuotaExceeded'
        default:
          $ref: '#/components/responses/AdapterError'
  /api/projects/{project_id}:
    parameters:
    - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: getProject
      summary: Return the public analysis only after a successful job
      responses:
        '200':
          description: Stored report serialized through AnalysisReport.to_dict().
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/AnalysisConflict'
        '429':
          $ref: '#/components/responses/QuotaExceeded'
        default:
          $ref: '#/components/responses/AdapterError'
    delete:
      operationId: deleteProject
      summary: Revoke access, cancel active work and remove project data
      description: After 204 all project and job reads return 404, including racing worker results. Inputs, reports,
        bundles and advisory data are removed; a failed physical cleanup is retried internally without restoring
        access. Repeating DELETE after removal returns 404.
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Access revoked and cleanup accepted; no response body.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/QuotaExceeded'
        default:
          $ref: '#/components/responses/AdapterError'
  /api/projects/{project_id}/plan:
    parameters:
    - $ref: '#/components/parameters/ProjectId'
    post:
      operationId: preparePlan
      summary: Prepare a plan from author decisions after analysis succeeds
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserDecisions'
      responses:
        '200':
          description: Draft, blocked or ready_to_verify plan with findings via plan.to_dict().
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackagePlan'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/AnalysisConflict'
        '422':
          $ref: '#/components/responses/InvalidDto'
        '429':
          $ref: '#/components/responses/QuotaExceeded'
        default:
          $ref: '#/components/responses/AdapterError'
  /api/projects/{project_id}/bundle:
    parameters:
    - $ref: '#/components/parameters/ProjectId'
    post:
      operationId: downloadBundle
      summary: Recompute a stored successful report into a plan and download ZIP
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BundleRequest'
      responses:
        '200':
          description: Reproducibility ZIP; draft export is allowed, blocked export is rejected.
          headers:
            Content-Disposition:
              schema:
                type: string
              description: attachment; filename="project.zip"
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/AnalysisConflict'
        '422':
          $ref: '#/components/responses/InvalidDto'
        '429':
          $ref: '#/components/responses/QuotaExceeded'
        default:
          $ref: '#/components/responses/AdapterError'
  /api/projects/{project_id}/advice:
    parameters:
    - $ref: '#/components/parameters/ProjectId'
    post:
      operationId: requestAdvice
      summary: Request optional AI suggestions after analysis succeeds
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdviceRequest'
      responses:
        '200':
          description: AI status is independent of the core pipeline; suggestions require confirmation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdvisoryResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/AnalysisConflict'
        '422':
          $ref: '#/components/responses/InvalidDto'
        '429':
          $ref: '#/components/responses/QuotaExceeded'
        default:
          $ref: '#/components/responses/AdapterError'
components:
  securitySchemes:
    SessionAuth:
      type: apiKey
      in: cookie
      name: __Host-nishtyak_session
      description: 'Opaque random session ID backed by server-side ownership records. Cookie attributes: Secure;
        HttpOnly; SameSite=Strict; Path=/; no Domain. Session issuance/login is outside this contract. No route
        permits anonymous access.'
  parameters:
    ProjectId:
      name: project_id
      in: path
      required: true
      schema:
        type: string
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Session-bound token supplied by the hosting UI bootstrap; validate Origin as well.
      schema:
        type: string
        minLength: 1
        maxLength: 256
  headers:
    RetryAfter:
      description: Required on 429; suggested polling delay on 202 and pending job responses, in seconds.
      schema:
        type: integer
        minimum: 1
        default: 2
  responses:
    BadRequest:
      description: Malformed JSON/options or an upload rejected before queueing; sanitized code/message.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthenticated:
      description: SESSION_REQUIRED; session cookie is absent, invalid or expired.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: REQUEST_FORBIDDEN; CSRF token or Origin validation failed. Never used for foreign IDs.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: RESOURCE_NOT_FOUND; identical for foreign, unknown, deleted and fully expired resources.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    AnalysisConflict:
      description: ANALYSIS_NOT_READY for queued/running; ANALYSIS_UNAVAILABLE for failed/timed_out/resource_limited;
        STALE_ANALYSIS for obsolete analysis_id; PLAN_BLOCKED for blocked bundle export.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UploadLimit:
      description: UPLOAD_LIMIT; compressed upload exceeds the server limit before queueing.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnsupportedMedia:
      description: UNSUPPORTED_MEDIA; only ZIP multipart uploads are accepted.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvalidDto:
      description: INVALID_REQUEST; invalid typed DTO, options, decisions or generator configuration.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    QuotaExceeded:
      description: QUEUE_FULL, RATE_LIMITED, STORAGE_QUOTA_EXCEEDED or ADVISORY_BUDGET_EXCEEDED. No partial project/job
        allocation is exposed when upload is rejected.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    AdapterError:
      description: Sanitized unexpected adapter failure; no traceback, source content or server paths.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    FileInfo:
      type: object
      properties:
        path:
          type: string
        size:
          type: integer
        sha256:
          type: string
      required:
      - path
      - size
      - sha256
    AnalysisOptions:
      type: object
      properties:
        python_version:
          type: string
        source_roots:
          type: array
          items:
            type: string
        max_source_bytes:
          type: integer
        max_files:
          type: integer
    ImportObservation:
      type: object
      properties:
        module:
          type: string
        path:
          type: string
        line:
          type: integer
        names:
          type: array
          items:
            type: string
        level:
          type: integer
        context:
          type: string
        kind:
          type: string
        id:
          type: string
      required:
      - module
      - path
      - line
    Finding:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        path:
          anyOf:
          - type: string
          - type: 'null'
        line:
          anyOf:
          - type: integer
          - type: 'null'
        severity:
          type: string
        evidence_ids:
          type: array
          items:
            type: string
        id:
          type: string
      required:
      - code
      - message
    DependencyCandidate:
      type: object
      properties:
        module:
          type: string
        category:
          type: string
          enum:
          - stdlib
          - local
          - external
          - unresolved
        package:
          anyOf:
          - type: string
          - type: 'null'
        requirement:
          anyOf:
          - type: string
          - type: 'null'
        status:
          type: string
        evidence_ids:
          type: array
          items:
            type: string
        reason:
          type: string
        context:
          type: string
        id:
          type: string
      required:
      - module
      - category
    AnalysisReport:
      type: object
      properties:
        analysis_id:
          type: string
        fingerprint:
          type: string
        options:
          $ref: '#/components/schemas/AnalysisOptions'
        files:
          type: array
          items:
            $ref: '#/components/schemas/FileInfo'
        imports:
          type: array
          items:
            $ref: '#/components/schemas/ImportObservation'
        dependencies:
          type: array
          items:
            $ref: '#/components/schemas/DependencyCandidate'
        findings:
          type: array
          items:
            $ref: '#/components/schemas/Finding'
        status:
          type: string
          enum:
          - complete
          - partial
        declared_requirements:
          type: array
          items:
            type: string
        python_requires:
          anyOf:
          - type: string
          - type: 'null'
        entrypoints:
          type: array
          items:
            type: string
        schema_version:
          type: integer
      required:
      - analysis_id
      - fingerprint
      - options
      - files
    RunSpec:
      type: object
      properties:
        target:
          type: string
        kind:
          type: string
          enum:
          - script
          - module
          default: script
        args:
          type: array
          items:
            type: string
        working_directory:
          type: string
      required:
      - target
      additionalProperties: false
    UserDecisions:
      type: object
      properties:
        analysis_id:
          type: string
        packages:
          type: object
          additionalProperties:
            type: string
        versions:
          type: object
          additionalProperties:
            type: string
        excluded_modules:
          type: array
          items:
            type: string
        excluded_files:
          type: array
          items:
            type: string
        run_spec:
          anyOf:
          - $ref: '#/components/schemas/RunSpec'
          - type: 'null'
        python_version:
          anyOf:
          - type: string
          - type: 'null'
        description:
          type: string
        input_description:
          type: string
        expected_output:
          type: string
        data_confirmed:
          type: boolean
      required:
      - analysis_id
      additionalProperties: false
    PackagePlan:
      type: object
      properties:
        report:
          $ref: '#/components/schemas/AnalysisReport'
        requirements:
          type: array
          items:
            type: string
        run_spec:
          anyOf:
          - $ref: '#/components/schemas/RunSpec'
          - type: 'null'
        python_version:
          anyOf:
          - type: string
          - type: 'null'
        files:
          type: array
          items:
            $ref: '#/components/schemas/FileInfo'
        excluded_files:
          type: array
          items:
            type: string
        findings:
          type: array
          items:
            $ref: '#/components/schemas/Finding'
        state:
          type: string
          enum:
          - draft
          - ready_to_verify
          - blocked
        description:
          type: string
        input_description:
          type: string
        expected_output:
          type: string
        decisions:
          anyOf:
          - $ref: '#/components/schemas/UserDecisions'
          - type: 'null'
      required:
      - report
      - requirements
      - run_spec
      - python_version
      - files
      - excluded_files
      - findings
      - state
    AdvisorySuggestion:
      type: object
      properties:
        kind:
          type: string
          enum:
          - explanation
          - readme_description
          - package_hypothesis
        text:
          type: string
        evidence_ids:
          type: array
          items:
            type: string
        module:
          anyOf:
          - type: string
          - type: 'null'
        package:
          anyOf:
          - type: string
          - type: 'null'
        requires_confirmation:
          type: boolean
      required:
      - kind
      - text
    TokenUsage:
      type: object
      properties:
        prompt_tokens:
          type: integer
        completion_tokens:
          type: integer
        total_tokens:
          type: integer
      required:
      - prompt_tokens
      - completion_tokens
      - total_tokens
    AdvisoryResult:
      type: object
      properties:
        analysis_id:
          type: string
        feature:
          type: string
        status:
          type: string
          enum:
          - ok
          - unavailable
          - invalid_response
          - invalid_request
        suggestions:
          type: array
          items:
            $ref: '#/components/schemas/AdvisorySuggestion'
        usage:
          anyOf:
          - $ref: '#/components/schemas/TokenUsage'
          - type: 'null'
        reason:
          anyOf:
          - type: string
          - type: 'null'
        schema_version:
          type: integer
      required:
      - analysis_id
      - feature
      - status
    ProjectResponse:
      type: object
      required:
      - project_id
      - analysis
      properties:
        project_id:
          type: string
        analysis:
          $ref: '#/components/schemas/AnalysisReport'
    ErrorResponse:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
        message:
          type: string
        findings:
          type: array
          items:
            $ref: '#/components/schemas/Finding'
    BundleRequest:
      type: object
      required:
      - decisions
      additionalProperties: false
      properties:
        decisions:
          $ref: '#/components/schemas/UserDecisions'
        include_dockerfile:
          type: boolean
          default: false
    AdviceRequest:
      type: object
      additionalProperties: false
      properties:
        feature:
          type: string
          enum:
          - explain
          - readme
          - packages
          default: explain
        description:
          type: string
          maxLength: 20000
          default: ''
    JobStatus:
      type: string
      enum:
      - queued
      - running
      - succeeded
      - failed
      - timed_out
      - resource_limited
      - expired
    ProjectAccepted:
      type: object
      additionalProperties: false
      required:
      - project_id
      - job_id
      - status
      properties:
        project_id:
          type: string
        job_id:
          type: string
        status:
          type: string
          enum:
          - queued
          - running
    JobResponse:
      type: object
      additionalProperties: false
      required:
      - project_id
      - job_id
      - status
      properties:
        project_id:
          type: string
        job_id:
          type: string
        status:
          $ref: '#/components/schemas/JobStatus'
        analysis:
          $ref: '#/components/schemas/AnalysisReport'
        error:
          $ref: '#/components/schemas/ErrorResponse'
      allOf:
      - if:
          properties:
            status:
              const: succeeded
        then:
          required:
          - analysis
        else:
          not:
            required:
            - analysis
      - if:
          properties:
            status:
              enum:
              - failed
              - timed_out
              - resource_limited
        then:
          required:
          - error
        else:
          not:
            required:
            - error
