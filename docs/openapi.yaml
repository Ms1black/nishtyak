components:
  schemas:
    AdviceDTO:
      properties:
        feature:
          type: string
          enum:
          - explain
          - readme
          - packages
          title: Feature
          default: explain
        description:
          type: string
          maxLength: 8192
          title: Description
          default: ''
      additionalProperties: false
      type: object
      title: AdviceDTO
    AdvisoryResult:
      properties:
        analysis_id:
          type: string
          title: Analysis Id
        feature:
          type: string
          title: Feature
        status:
          type: string
          enum:
          - ok
          - unavailable
          - invalid_response
          - invalid_request
          title: Status
        suggestions:
          items:
            $ref: '#/components/schemas/AdvisorySuggestion'
          type: array
          title: Suggestions
          default: []
        usage:
          anyOf:
          - $ref: '#/components/schemas/TokenUsage'
          - type: 'null'
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
        schema_version:
          type: integer
          title: Schema Version
          default: 1
      type: object
      required:
      - analysis_id
      - feature
      - status
      title: AdvisoryResult
    AdvisorySuggestion:
      properties:
        kind:
          type: string
          enum:
          - explanation
          - readme_description
          - package_hypothesis
          title: Kind
        text:
          type: string
          title: Text
        evidence_ids:
          items:
            type: string
          type: array
          title: Evidence Ids
          default: []
        module:
          anyOf:
          - type: string
          - type: 'null'
          title: Module
        package:
          anyOf:
          - type: string
          - type: 'null'
          title: Package
        requires_confirmation:
          type: boolean
          title: Requires Confirmation
          default: true
      type: object
      required:
      - kind
      - text
      title: AdvisorySuggestion
    AnalysisOptions:
      properties:
        python_version:
          type: string
          title: Python Version
          default: '3.11'
        source_roots:
          items:
            type: string
          type: array
          title: Source Roots
          default:
          - .
        max_source_bytes:
          type: integer
          title: Max Source Bytes
          default: 1000000
        max_files:
          type: integer
          title: Max Files
          default: 1000
      additionalProperties: false
      type: object
      title: AnalysisOptions
    AnalysisReport:
      properties:
        analysis_id:
          type: string
          title: Analysis Id
        fingerprint:
          type: string
          title: Fingerprint
        options:
          $ref: '#/components/schemas/AnalysisOptions'
        files:
          items:
            $ref: '#/components/schemas/FileInfo'
          type: array
          title: Files
        imports:
          items:
            $ref: '#/components/schemas/ImportObservation'
          type: array
          title: Imports
          default: []
        dependencies:
          items:
            $ref: '#/components/schemas/DependencyCandidate'
          type: array
          title: Dependencies
          default: []
        findings:
          items:
            $ref: '#/components/schemas/Finding'
          type: array
          title: Findings
          default: []
        status:
          type: string
          title: Status
          default: complete
        declared_requirements:
          items:
            type: string
          type: array
          title: Declared Requirements
          default: []
        python_requires:
          anyOf:
          - type: string
          - type: 'null'
          title: Python Requires
        entrypoints:
          items:
            type: string
          type: array
          title: Entrypoints
          default: []
        schema_version:
          type: integer
          title: Schema Version
          default: 1
      additionalProperties: false
      type: object
      required:
      - analysis_id
      - fingerprint
      - options
      - files
      title: AnalysisReport
    BundleDTO:
      properties:
        decisions:
          $ref: '#/components/schemas/DecisionsDTO'
        include_dockerfile:
          type: boolean
          title: Include Dockerfile
          default: false
      additionalProperties: false
      type: object
      required:
      - decisions
      title: BundleDTO
    DecisionsDTO:
      properties:
        analysis_id:
          type: string
          pattern: ^[a-f0-9]{20}$
          title: Analysis Id
        packages:
          additionalProperties:
            type: string
            maxLength: 2048
          propertyNames:
            maxLength: 2048
          type: object
          maxProperties: 1000
          title: Packages
        versions:
          additionalProperties:
            type: string
            maxLength: 2048
          propertyNames:
            maxLength: 2048
          type: object
          maxProperties: 1000
          title: Versions
        excluded_modules:
          items:
            type: string
            maxLength: 2048
          type: array
          maxItems: 1000
          title: Excluded Modules
        excluded_files:
          items:
            type: string
            maxLength: 1024
            minLength: 1
          type: array
          maxItems: 1000
          title: Excluded Files
        run_spec:
          anyOf:
          - $ref: '#/components/schemas/RunSpecDTO'
          - type: 'null'
        python_version:
          anyOf:
          - type: string
            maxLength: 16
            minLength: 1
          - type: 'null'
          title: Python Version
        description:
          type: string
          maxLength: 8192
          title: Description
          default: ''
        input_description:
          type: string
          maxLength: 8192
          title: Input Description
          default: ''
        expected_output:
          type: string
          maxLength: 8192
          title: Expected Output
          default: ''
        data_confirmed:
          type: boolean
          title: Data Confirmed
          default: false
      additionalProperties: false
      type: object
      required:
      - analysis_id
      title: DecisionsDTO
    DependencyCandidate:
      properties:
        module:
          type: string
          title: Module
        category:
          type: string
          title: Category
        package:
          anyOf:
          - type: string
          - type: 'null'
          title: Package
        requirement:
          anyOf:
          - type: string
          - type: 'null'
          title: Requirement
        status:
          type: string
          title: Status
          default: inferred
        evidence_ids:
          items:
            type: string
          type: array
          title: Evidence Ids
          default: []
        reason:
          type: string
          title: Reason
          default: ''
        context:
          type: string
          title: Context
          default: runtime
        id:
          type: string
          title: Id
          default: ''
      additionalProperties: false
      type: object
      required:
      - module
      - category
      title: DependencyCandidate
    ErrorDTO:
      properties:
        code:
          type: string
          title: Code
        message:
          type: string
          title: Message
      additionalProperties: false
      type: object
      required:
      - code
      - message
      title: ErrorDTO
    FileInfo:
      properties:
        path:
          type: string
          title: Path
        size:
          type: integer
          title: Size
        sha256:
          type: string
          title: Sha256
      additionalProperties: false
      type: object
      required:
